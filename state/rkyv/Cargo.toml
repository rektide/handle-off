[package]
name = "handle-off-state-rkyv"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Bounded checked rkyv encoding for handle-off manifest and opaque state metadata"

[dependencies]
handle-off-bundle = { path = "../../handles/bundle", version = "0.1.0" }
handle-off-handles = { path = "../../handles/core", version = "0.1.0" }
handle-off-state = { path = "../core", version = "0.1.0" }
# Wire version 1 fixes this archive implementation and format configuration.
rkyv = { version = "=0.8.18", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
