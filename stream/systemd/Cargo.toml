[package]
name = "handle-off-stream-journal"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Experimental source-bound systemd journal checkpoints"

[[bin]]
name = "ho-journal"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"
