[package]
name = "handle-off-stream-durable"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Pre-alpha Durable Streams HTTP workbench with enduring file readers"

[[bin]]
name = "durable-workbench"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
