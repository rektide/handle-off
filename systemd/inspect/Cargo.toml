[package]
name = "handle-off-systemd-inspect"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Optional bounded busctl inspection of exact service identity and fdstore metadata membership"

[dependencies]
handle-off-systemd-fdstore = { path = "../fdstore", version = "0.1.0" }

[target.'cfg(target_os = "linux")'.dependencies]
roxmltree = "0.21.1"
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "event", "process"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "linux")'.dev-dependencies]
handle-off-systemd-notify = { path = "../notify", version = "0.1.0" }
