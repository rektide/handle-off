[package]
name = "handle-off"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Composable resource handoff: pass, retain, and recover open resources together with the information needed to continue using them"

[features]
default = []
handles = ["dep:handle-off-handles"]
state = ["dep:handle-off-state"]
bundle = ["dep:handle-off-bundle"]
invocation = ["dep:handle-off-invocation"]
stdio = ["dep:handle-off-stdio"]
local = ["invocation", "stdio"]
unix-rights = ["dep:handle-off-unix-rights"]
state-rkyv = ["dep:handle-off-state-rkyv"]
state-memfd = ["dep:handle-off-state-memfd"]
activation = ["dep:handle-off-activation"]
transport-unix = ["dep:handle-off-transport-unix"]

[dependencies]
handle-off-handles = { path = "../handles/core", version = "0.1.0", optional = true }
handle-off-state = { path = "../state/core", version = "0.1.0", optional = true }
handle-off-bundle = { path = "../handles/bundle", version = "0.1.0", optional = true }
handle-off-invocation = { path = "../invocation/core", version = "0.1.0", optional = true }
handle-off-stdio = { path = "../handles/stdio", version = "0.1.0", optional = true }
handle-off-unix-rights = { path = "../handles/unix-rights", version = "0.1.0", optional = true }
handle-off-state-rkyv = { path = "../state/rkyv", version = "0.1.0", optional = true }
handle-off-state-memfd = { path = "../state/memfd", version = "0.1.0", optional = true }
handle-off-activation = { path = "../systemd/activation", version = "0.1.0", optional = true }
handle-off-transport-unix = { path = "../transport/unix", version = "0.1.0", optional = true }
